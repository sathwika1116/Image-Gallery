<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore Beautiful Moments</p>
    </header>

    <div class="filters">
        <button onclick="filterImages('all')">All</button>
        <button onclick="filterImages('nature')">Nature</button>
        <button onclick="filterImages('animals')">Animals</button>
        <button onclick="filterImages('cities')">Cities</button>
    </div>

    <div class="gallery">

        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
        class="nature" onclick="openLightbox(this)">

        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
        class="nature" onclick="openLightbox(this)">

        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600"
        class="animals" onclick="openLightbox(this)">

        <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=600"
        class="animals" onclick="openLightbox(this)">

        <img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600"
        class="cities" onclick="openLightbox(this)">

        <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?w=600"
        class="cities" onclick="openLightbox(this)">

    </div>

    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">×</span>
        <button class="prev" onclick="changeImage(-1)">❮</button>
        <img id="largeImage">
        <button class="next" onclick="changeImage(1)">❯</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
